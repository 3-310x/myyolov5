# YOLOv5 超参数配置 for SENet 模型

# 优化器
optimizer: SGD  # 可选 'SGD', 'Adam', 'AdamW'

# 学习率
lr0: 0.005  # 初始学习率，默认 0.01，适当降低以适应新模块
lrf: 0.2    # 最终学习率，默认 0.2

# 优化器参数
momentum: 0.937  # 动量
weight_decay: 0.0005  # 权重衰减
warmup_epochs: 3.0  # 热身训练轮数
warmup_momentum: 0.8  # 热身动量
warmup_bias_lr: 0.1  # 热身偏置学习率

# 损失函数权重
box: 0.05  # 定位损失权重
cls: 0.3   # 分类损失权重，默认 0.5，适当降低
obj: 1.5   # 目标置信度损失权重，默认 1.0，适当增加

# 其他损失参数
label_smoothing: 0.0  # 标签平滑
fl_gamma: 0.0  # Focal Loss gamma，默认不使用 Focal Loss

# 数据增强
hsv_h: 0.015  # 色调变化
hsv_s: 0.7    # 饱和度变化
hsv_v: 0.4    # 明度变化
degrees: 0.0  # 旋转角度
translate: 0.1  # 平移
scale: 0.5    # 缩放
shear: 0.0    # 剪切
perspective: 0.0  # 透视变换
flipud: 0.0   # 上下翻转
fliplr: 0.5   # 左右翻转
mosaic: 1.0   # 是否使用 Mosaic 数据增强
mixup: 0.0    # 是否使用 MixUp 数据增强

# 锚框调整
anchors: 3  # 锚框数

# 训练标签熵惩罚
balance: [0.4, 1.0, 4.0, 1.0]  # 各层次的损失平衡系数
